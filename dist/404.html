<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07110e">
  <title>Page not found — Gabriel Oliveira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307110e'/%3E%3Cpath d='M17 20h30v8H27v8h16v8H17z' fill='%23c9ff5b'/%3E%3C/svg%3E">
  <style>
    :root { --bg:#07110e; --surface:#0d1915; --ink:#f2f7f1; --muted:#9aa9a1; --line:rgba(220,240,226,.14); --accent:#c9ff5b; --mint:#6ee7c2; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; min-height:100vh; display:grid; place-items:center; padding:2rem 1rem; color:var(--ink); background:radial-gradient(circle at 80% -10%,rgba(110,231,194,.14),transparent 28rem),var(--bg); font:400 1rem/1.65 "Manrope",sans-serif; }
    body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.3; background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px); background-size:72px 72px; mask-image:linear-gradient(#000,transparent 75%); }
    main { width:min(100%,560px); }
    .terminal { border:1px solid var(--line); border-radius:22px; overflow:hidden; background:rgba(13,25,21,.85); box-shadow:0 28px 80px rgba(0,0,0,.32); }
    .terminal-top { display:flex; gap:.4rem; padding:1rem; border-bottom:1px solid var(--line); }
    .terminal-top i { width:9px; height:9px; border-radius:50%; background:#415149; }
    .terminal-body { padding:1.6rem; font:400 .85rem/1.9 "DM Mono",monospace; color:#bdc9c2; }
    .terminal-body p { margin:.1rem 0; }
    .prompt { color:var(--accent); }
    .error { color:#ffd166; }
    h1 { margin:2.2rem 0 .6rem; font-size:clamp(2.4rem,9vw,3.6rem); line-height:1; letter-spacing:-.06em; }
    .copy { margin:0 0 1.8rem; color:var(--muted); }
    .button { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:.75rem 1.1rem; border:1px solid var(--accent); border-radius:999px; background:var(--accent); color:var(--bg); text-decoration:none; font-weight:800; }
    .button:hover { background:#dcff91; }
  </style>
</head>
<body>
  <main>
    <div class="terminal" aria-hidden="true">
      <div class="terminal-top"><i></i><i></i><i></i></div>
      <div class="terminal-body">
        <p><span class="prompt">$</span> curl <span id="path">/this-page</span></p>
        <p class="error">✗ 404 — route not found</p>
        <p><span class="prompt">$</span> cd ~</p>
      </div>
    </div>
    <h1 data-i18n="title">This page doesn’t exist.</h1>
    <p class="copy" data-i18n="copy">The link may be outdated or mistyped. Everything else is one click away.</p>
    <a class="button" href="/" data-i18n="home">Back to portfolio</a>
  </main>
  <script>
    document.getElementById('path').textContent = location.pathname;
    let saved = null; try { saved = localStorage.getItem('portfolio-language'); } catch {}
    const lang = saved === 'pt' || saved === 'en' ? saved : ((navigator.language || '').toLowerCase().startsWith('pt') ? 'pt' : 'en');
    if (lang === 'pt') {
      const pt = { title: 'Esta página não existe.', copy: 'O link pode estar desatualizado ou digitado errado. O resto do site está a um clique.', home: 'Voltar ao portfólio' };
      document.documentElement.lang = 'pt-BR';
      document.title = 'Página não encontrada — Gabriel Oliveira';
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = pt[el.dataset.i18n]; });
    }
  </script>
</body>
</html>
